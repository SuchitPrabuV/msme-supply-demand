{% extends "base.html" %}

{% block content %}

<h2>Dashboard</h2>
<hr>

<div class="row">

    <div class="col-md-4">
        <div class="card border-danger">
            <div class="card-body">
                <h5 class="card-title text-danger">Critical Alerts</h5>
                <h2>3</h2>
                <p>Items below safety stock</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card border-warning">
            <div class="card-body">
                <h5 class="card-title text-warning">Warning Alerts</h5>
                <h2>5</h2>
                <p>Low inventory risk</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card border-success">
            <div class="card-body">
                <h5 class="card-title text-success">Healthy Items</h5>
                <h2>12</h2>
                <p>No immediate risk</p>
            </div>
        </div>
    </div>

</div>

{% endblock %}
