<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MSME Control Tower</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 10px;
        }
    </style>

</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<body>

    <div class="d-flex">

        <!-- Sidebar -->
        <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
            <h4>Control Tower</h4>
            <hr>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/upload">Upload Data</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/simulation">What-If Engine</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/items-view">Items</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/demand-orders-view">Demand Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/supply-orders-view">Supply Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/api/production/view">Production Runs</a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4">
            {% block content %}
            {% endblock %}
        </div>

    </div>

</body>

</html>
